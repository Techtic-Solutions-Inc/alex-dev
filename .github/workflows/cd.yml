name: CD

on:
  push:
    branches:
      - develop
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      skip_deploy:
        description: Run build and migrations only (skip deploy hook)
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.environment || 'branch' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve-target:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.map.outputs.environment }}
      image_tag: ${{ steps.map.outputs.image_tag }}
    steps:
      - id: map
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            ENV="development"
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ENV="staging"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            echo "Unsupported ref for CD: ${{ github.ref }}" >&2
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "environment=${ENV}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${ENV}-${SHORT_SHA}" >> "${GITHUB_OUTPUT}"

  validate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build-image:
    name: Build and push container image
    needs: [resolve-target, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-target.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-target.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Apply database migrations
    needs: [resolve-target, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.resolve-target.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install production dependencies and build
        run: |
          npm ci
          npm run build

      - name: Migration status (pre)
        env:
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_RUNNER_ID: github-actions-${{ github.run_id }}
        run: npm run migration:status:prod

      - name: Apply pending migrations
        env:
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_RUNNER_ID: github-actions-${{ github.run_id }}
        run: npm run migration:up:prod

      - name: Migration status (post)
        env:
          MIGRATIONS_DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_RUNNER_ID: github-actions-${{ github.run_id }}
        run: npm run migration:status:prod

  deploy:
    name: Deploy application
    needs: [resolve-target, build-image, migrate]
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.skip_deploy == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.resolve-target.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Run deployment hook
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.resolve-target.outputs.environment }}
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.resolve-target.outputs.image_tag }}
          DEPLOY_IMAGE_LATEST: ghcr.io/${{ github.repository }}:${{ needs.resolve-target.outputs.environment }}-latest
          DEPLOY_REF: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
          KUBE_DEPLOYMENT: ${{ vars.KUBE_DEPLOYMENT }}
        run: bash scripts/deploy.sh