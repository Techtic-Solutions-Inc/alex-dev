apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-api
spec:
  rules:
    - host: staging-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-api
                port:
                  number: 80
  tls:
    - hosts:
        - staging-api.example.com
      secretName: backend-api-staging-tls