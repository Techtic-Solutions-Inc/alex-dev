apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-api-config
data:
  NODE_ENV: production
  PORT: "3000"
  LOG_LEVEL: info
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  JWT_EXPIRY: "3600"
  JWT_REFRESH_EXPIRY: "86400"
  EMAIL_VERIFICATION_TOKEN_EXPIRY_HOURS: "24"
  RATE_LIMIT_POINTS: "100"
  RATE_LIMIT_DURATION: "1"
  RATE_LIMIT_STRATEGY: "fixed"
  CORS_ORIGIN: "*"
  APM_ENABLED: "false"
  APM_PROVIDER: datadog
  APM_SLOW_REQUEST_THRESHOLD_MS: "2000"
  DD_SERVICE: backend-api
  DD_ENV: production
  DD_TRACE_AGENT_PORT: "8126"