apiVersion: batch/v1
kind: Job
metadata:
  name: backend-api-migrate
  annotations:
    description: Apply MongoDB schema migrations before or alongside API rollouts.
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: backend-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          image: backend-api:production-latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/database/migrations/migration.cli.js
            - up
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: MIGRATION_RUNNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: backend-api-config
            - secretRef:
                name: backend-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]