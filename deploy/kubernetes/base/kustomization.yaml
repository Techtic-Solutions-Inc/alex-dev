apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - certificate.yaml
  - hpa.yaml
  - migration-job.yaml

commonLabels:
  app.kubernetes.io/name: backend-api
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: agentwise
  app.kubernetes.io/managed-by: kustomize

images:
  - name: backend-api
    newName: ghcr.io/REPLACE_OWNER/REPLACE_REPO
    newTag: production-latest