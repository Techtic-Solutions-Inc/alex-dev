apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-api
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: agentwise
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - backend-api-production
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http