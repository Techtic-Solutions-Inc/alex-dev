# A generic, single database configuration.

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os

# Naming template: sequential number + short description
file_template = %%(rev)s_%%(slug)s

# Overridden at runtime by alembic/env.py from DATABASE_URL in .env
sqlalchemy.url = postgresql+asyncpg://<username>:<password>@<host>/<dbname>

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
